<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Хранилище</title>
  <style>
    :root { --bg:#10151F; --panel:#182030; --line:#27324A; --text:#E7EAF3; --dim:#8A94AB; --acc:#7C9CFF; --bad:#FF7A85; --warn:#F2C26B; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .hidden { display:none !important; }
    .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
    .narrow { width:100%; max-width:380px; padding:28px; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    .dim { color:var(--dim); } .err { color:var(--bad); font-size:.9rem; }
    label { display:block; font-size:.875rem; color:var(--dim); margin:14px 0 6px; }
    input, textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); font:inherit; }
    input:focus, textarea:focus, button:focus-visible, summary:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
    .btn { border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; font-weight:500; color:var(--text); background:transparent; cursor:pointer; }
    .btn:hover { background:#202a40; } .btn:disabled { opacity:.5; cursor:wait; }
    .main { background:var(--acc); border-color:var(--acc); color:#10151F; } .main:hover { background:#97B0FF; }
    .del { color:var(--bad); border-color:#5a2a33; }
    .full { width:100%; margin-top:18px; }
    header { display:flex; align-items:center; gap:12px; padding:0 16px; height:56px; border-bottom:1px solid var(--line); background:var(--panel); }
    header strong { flex:1; }
    .wrap { max-width:820px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:16px; }
    .warn { background:#3a2f14; border:1px solid #6b5522; color:var(--warn); padding:12px 16px; }
    .notice { white-space:pre-line; border-color:var(--acc); }
    summary { cursor:pointer; font-weight:600; }
    details form { margin-top:8px; }
    ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
    li.item { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; }
    .ico { font-size:1.9rem; line-height:1; }
    .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
    .grow h3 { margin:0; font-size:1rem; } .grow p { margin:4px 0 0; font-size:.875rem; }
    .btns { display:flex; gap:8px; }
    #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:.9rem; max-width:90vw; }
  </style>
</head>
<body>

  <main id="lock" class="center">
    <form id="lock-form" class="card narrow">
      <h1>🔒 Хранилище</h1>
      <p class="dim" style="margin:0">Введите пароль, чтобы открыть файлы.</p>
      <label for="pw">Пароль</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <p id="lock-error" class="err hidden" role="alert"></p>
      <button id="open-btn" class="btn main full" type="submit">Открыть</button>
    </form>
  </main>

  <div id="vault" class="hidden">
    <header>
      <strong>🔓 Хранилище</strong>
      <button id="logout" class="btn" type="button">Выйти</button>
    </header>
    <div class="wrap">
      <div id="warn" class="card warn hidden">Сейчас стоит временный пароль. Его легко подобрать, поэтому смените его (раздел «Сменить пароль») до того, как загружать настоящие файлы.</div>
      <div id="notice" class="card notice hidden" role="status"></div>

      <div id="content" class="wrap" style="padding:0">
        <details class="card" id="add-box">
          <summary>Добавить файл</summary>
          <form id="add-form">
            <label for="f-file">Файл (до 25 МБ)</label>
            <input id="f-file" type="file" required>
            <label for="f-title">Название</label>
            <input id="f-title" required maxlength="200">
            <label for="f-desc">Описание (необязательно)</label>
            <textarea id="f-desc" rows="2" maxlength="2000"></textarea>
            <button id="add-btn" class="btn main full" type="submit">Зашифровать и подготовить к загрузке</button>
          </form>
        </details>

        <details class="card" id="pw-box">
          <summary>Сменить пароль</summary>
          <form id="pw-form">
            <label for="pw1">Новый пароль (не короче 10 символов)</label>
            <input id="pw1" type="password" autocomplete="new-password" required minlength="10">
            <label for="pw2">Повторите пароль</label>
            <input id="pw2" type="password" autocomplete="new-password" required minlength="10">
            <button id="pw-btn" class="btn main full" type="submit">Перешифровать всё новым паролем</button>
          </form>
        </details>

        <input id="search" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию">
        <ul id="list"></ul>
        <p id="empty" class="dim hidden" style="text-align:center">Файлов пока нет.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden" role="status"></div>

  <script>
  (() => {
    'use strict';
    // Всё шифрование выполняется встроенным в браузер Web Crypto. Никаких внешних сервисов и библиотек.
    const ITER = 600000;                                    // замедляет подбор пароля
    const MAGIC = new Uint8Array([0x56, 0x4C, 0x54, 0x31]); // "VLT1"
    const DEFAULT_PW = '123123';
    const MAX_BYTES = 25 * 1024 * 1024;                     // лимит загрузки через сайт GitHub
    const ICONS = { pdf:'📕', zip:'🗜️', txt:'📄', csv:'📊', xlsx:'📊', docx:'📝', pptx:'📽️',
                    png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', webp:'🖼️', mp3:'🎵', mp4:'🎬' };
    const HOWTO = [
      'Скачан файл vault-update.zip. Что дальше:',
      '1. Распакуйте архив: внутри будет папка data.',
      '2. Откройте репозиторий на GitHub → Add file → Upload files.',
      '3. Перетащите папку data из архива и нажмите Commit changes.',
      '4. Через 1–2 минуты обновите эту страницу.',
    ];

    const te = new TextEncoder(), td = new TextDecoder();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const extOf = (n) => (n.indexOf('.') >= 0 ? n.split('.').pop().toLowerCase() : '');
    const fmtSize = (b) => b < 1024 ? b + ' Б' : b < 1048576 ? (b / 1024).toFixed(1) + ' КБ' : (b / 1048576).toFixed(1) + ' МБ';
    const fmtDate = (d) => new Date(d).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
    const concat = (...parts) => {
      const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0;
      for (const p of parts) { out.set(p, o); o += p.length; }
      return out;
    };

    // ---------- шифрование: PBKDF2-SHA256 -> AES-256-GCM ----------
    async function deriveKey(password, salt) {
      const base = await crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt, iterations: ITER },
        base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
    }
    async function seal(key, bytes, label) {       // iv(12) + шифртекст; label привязывает данные к имени
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt(
        { name:'AES-GCM', iv, additionalData: te.encode(label) }, key, bytes));
      return concat(iv, ct);
    }
    async function unseal(key, blob, label) {
      return new Uint8Array(await crypto.subtle.decrypt(
        { name:'AES-GCM', iv: blob.slice(0, 12), additionalData: te.encode(label) }, key, blob.slice(12)));
    }

    // ---------- zip без сжатия (чтобы отдать файлы одним архивом) ----------
    const CRC = (() => { const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
      return t; })();
    const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    function makeZip(entries) {
      const parts = [], central = []; let offset = 0;
      for (const e of entries) {
        const name = te.encode(e.name), crc = crc32(e.data), size = e.data.length;
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
        lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true);
        lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
        parts.push(new Uint8Array(lh.buffer), name, e.data);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
        ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
        ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
        central.push(new Uint8Array(ch.buffer), name);
        offset += 30 + name.length + size;
      }
      const cdSize = central.reduce((n, p) => n + p.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
    }

    // ---------- состояние (только в памяти, на диск ничего не пишется) ----------
    let key = null, salt = null, manifest = null, usingDefault = false;
    const pending = new Map();   // id -> зашифрованные данные, ещё не загруженные в репозиторий

    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 5000);
    }
    function lockError(msg) { const e = $('lock-error'); e.textContent = msg; e.classList.toggle('hidden', !msg); }
    function notice(lines) { const n = $('notice'); n.textContent = lines.join('\n'); n.classList.remove('hidden'); }
    function saveBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    async function fetchBytes(path) {
      const r = await fetch(path, { cache: 'no-store' });
      if (!r.ok) throw Object.assign(new Error(r.status === 404
        ? 'Файл ' + path + ' не найден в репозитории. Загрузите папку data.' : 'Ошибка загрузки (' + r.status + ').'), { status: r.status });
      return new Uint8Array(await r.arrayBuffer());
    }
    async function run(btn, fn) {
      const label = btn.textContent; btn.disabled = true;
      try { await fn(); } catch (e) { toast(e.message || String(e)); }
      btn.disabled = false; btn.textContent = label;
    }

    // ---------- вход: пароль верен, если с ним расшифровался каталог ----------
    async function unlock(password) {
      let buf;
      try { buf = await fetchBytes('data/index.enc'); }
      catch (e) { throw e.status ? e : new Error('Нет связи с сайтом. Проверьте интернет.'); }
      if (buf.length < 4 + 16 + 12 + 16 || !MAGIC.every((b, i) => buf[i] === b)) throw new Error('Файл data/index.enc повреждён.');
      const s = buf.slice(4, 20), k = await deriveKey(password, s);
      let plain;
      try { plain = await unseal(k, buf.slice(20), 'index'); }
      catch (e) { throw Object.assign(new Error('bad'), { bad: true }); }
      manifest = JSON.parse(td.decode(plain));
      key = k; salt = s; usingDefault = password === DEFAULT_PW;
    }

    $('lock-form').addEventListener('submit', async (e) => {
      e.preventDefault(); lockError('');
      const btn = $('open-btn'); btn.disabled = true; btn.textContent = 'Проверяю…';
      try {
        await unlock($('pw').value);
        $('pw').value = '';
        $('lock').classList.add('hidden'); $('vault').classList.remove('hidden');
        $('warn').classList.toggle('hidden', !usingDefault);
        render();
      } catch (err) { lockError(err.bad ? 'Неверный пароль.' : err.message); }
      btn.disabled = false; btn.textContent = 'Открыть';
    });
    $('logout').addEventListener('click', () => location.reload());

    // ---------- список ----------
    function render() {
      const q = $('search').value.trim().toLowerCase();
      const shown = manifest.files.filter((f) => f.title.toLowerCase().includes(q));
      $('list').innerHTML = shown.map((f) => `
        <li class="card item">
          <span class="ico" aria-hidden="true">${ICONS[extOf(f.name)] || '📁'}</span>
          <div class="grow">
            <h3>${esc(f.title)}</h3>
            ${f.desc ? `<p class="dim">${esc(f.desc)}</p>` : ''}
            <p class="dim">${fmtSize(f.size)} · ${fmtDate(f.added)}${pending.has(f.id) ? ' · ещё не загружен на GitHub' : ''}</p>
          </div>
          <div class="btns">
            <button class="btn main" data-dl="${esc(f.id)}" type="button">Скачать</button>
            <button class="btn del" data-del="${esc(f.id)}" type="button">Удалить</button>
          </div>
        </li>`).join('');
      $('empty').classList.toggle('hidden', shown.length > 0);
      $('empty').textContent = manifest.files.length ? 'Ничего не найдено.' : 'Файлов пока нет.';
    }
    $('search').addEventListener('input', render);

    async function packUpdate() {
      const index = concat(MAGIC, salt, await seal(key, te.encode(JSON.stringify(manifest)), 'index'));
      const entries = [{ name: 'data/index.enc', data: index }];
      for (const [id, enc] of pending) entries.push({ name: 'data/' + id + '.enc', data: enc });
      return entries;
    }

    $('list').addEventListener('click', async (e) => {
      const dl = e.target.closest('[data-dl]'), del = e.target.closest('[data-del]');
      const btn = dl || del; if (!btn) return;
      const f = manifest.files.find((x) => x.id === (dl ? dl.dataset.dl : del.dataset.del)); if (!f) return;
      if (dl) {
        await run(btn, async () => {
          const enc = pending.get(f.id) || await fetchBytes('data/' + f.id + '.enc');
          let plain;
          try { plain = await unseal(key, enc, f.id); } catch (err) { throw new Error('Не удалось расшифровать файл: он повреждён или загружен со старым паролем.'); }
          saveBlob(new Blob([plain]), f.name);
        });
      } else {
        if (!confirm('Удалить «' + f.title + '» из каталога?')) return;
        await run(btn, async () => {
          manifest.files = manifest.files.filter((x) => x.id !== f.id);
          pending.delete(f.id);
          saveBlob(makeZip(await packUpdate()), 'vault-update.zip');
          notice([...HOWTO, '', 'Чтобы удалить и сам зашифрованный файл, откройте в репозитории data/' + f.id + '.enc и нажмите Delete.']);
          render();
        });
      }
    });

    // ---------- добавить файл ----------
    $('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = $('f-file').files[0]; if (!file) return;
      if (file.size > MAX_BYTES) { toast('Файл больше 25 МБ: GitHub не примет его через сайт.'); return; }
      await run($('add-btn'), async () => {
        $('add-btn').textContent = 'Шифрую…';
        const plain = new Uint8Array(await file.arrayBuffer());
        const id = crypto.randomUUID().replace(/-/g, '');
        pending.set(id, await seal(key, plain, id));
        manifest.files.unshift({ id, title: $('f-title').value.trim(), desc: $('f-desc').value.trim(),
                                 name: file.name, size: plain.length, added: new Date().toISOString() });
        saveBlob(makeZip(await packUpdate()), 'vault-update.zip');
        notice(['Файл зашифрован в вашем браузере.', ...HOWTO]);
        $('add-form').reset(); $('add-box').open = false; render();
      });
    });
    $('f-file').addEventListener('change', () => {
      const f = $('f-file').files[0];
      if (f && !$('f-title').value) $('f-title').value = f.name.replace(/\.[^.]+$/, '');
    });

    // ---------- смена пароля ----------
    $('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = $('pw1').value, p2 = $('pw2').value;
      if (p1.length < 10) { toast('Пароль короче 10 символов.'); return; }
      if (p1 === DEFAULT_PW) { toast('Выберите другой пароль.'); return; }
      if (p1 !== p2) { toast('Пароли не совпадают.'); return; }
      await run($('pw-btn'), async () => {
        $('pw-btn').textContent = 'Перешифровываю…';
        const newSalt = crypto.getRandomValues(new Uint8Array(16)), newKey = await deriveKey(p1, newSalt);
        const entries = [];
        for (const f of manifest.files) {
          const enc = pending.get(f.id) || await fetchBytes('data/' + f.id + '.enc');
          const plain = await unseal(key, enc, f.id);
          entries.push({ name: 'data/' + f.id + '.enc', data: await seal(newKey, plain, f.id) });
        }
        const index = concat(MAGIC, newSalt, await seal(newKey, te.encode(JSON.stringify(manifest)), 'index'));
        entries.unshift({ name: 'data/index.enc', data: index });
        saveBlob(makeZip(entries), 'vault-update.zip');
        notice([...HOWTO, '', 'Важно: заменяются все файлы в папке data. После загрузки входите с новым паролем.']);
        $('content').classList.add('hidden'); $('warn').classList.add('hidden');
      });
    });

    if (!window.crypto || !crypto.subtle) lockError('Браузер не поддерживает шифрование или страница открыта не по https.');
  })();
  </script>
</body>
</html>
